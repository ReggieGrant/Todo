name: Run Android Test
on: push # Listen for push events

jobs:
  unit-test:
    runs-on: ubuntu-latest # Use Ubuntu 22.04 as the runner OS
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 #download the test the VM

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin' # Use the focal version of OpenJDK

      - name: Make gradlew executable #Make the script executable
        run: chmod +x ./gradlew #Make gradlew executable

      - name: Run unit tests # Run the unit tests
        run: ./gradlew test


      - name: Upload test report if test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/